# Module purpose: Delegates canonical and supplemental continuous-integration evidence to the checked-in repository gate.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# R5 provenance: official actions/* refs/tags/v4 resolved read-only on 2026-07-21; every checkout drops credentials.
jobs:
  canonical-windows:
    name: Canonical repository gate
    runs-on: windows-2025
    # The former parallel jobs had 125 minutes of combined bounded envelopes; the canonical runner now executes them sequentially.
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'ga'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
          cache-dependency-path: src/DBNotifier.Dashboard.Web/package-lock.json
      - name: Run the canonical DB-Notifier gate exactly once
        shell: pwsh
        run: .\scripts\ci.ps1 -Stage All -DotNetPath dotnet -NodePath node -NpmPath npm -DiagnosticRoot "${{ runner.temp }}\dbnotifier-ci-diagnostics"
      - name: Upload sanitised runtime failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dbnotifier-runtime-failure-${{ github.run_attempt }}
          path: ${{ runner.temp }}\dbnotifier-ci-diagnostics\**\*.json
          if-no-files-found: ignore
          retention-days: 7

  dashboard-linux:
    name: Supplemental Dashboard Linux compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
          cache-dependency-path: src/DBNotifier.Dashboard.Web/package-lock.json
      - name: Run the supplemental Dashboard gate through the shared entry point
        shell: pwsh
        run: ./scripts/ci.ps1 -Stage Dashboard -NodePath node -NpmPath npm
