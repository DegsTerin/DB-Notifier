# Purpose: Deploys only the deterministic DB-Notifier Dashboard portfolio preview as a Render Static Site.
services:
  - type: web
    runtime: static
    name: db-notifier-demo
    rootDir: src/DBNotifier.Dashboard.Web
    buildCommand: npm ci --ignore-scripts --no-audit --no-fund && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; connect-src 'none'; font-src 'self'; form-action 'none'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'; upgrade-insecure-requests"
      - path: /*
        name: Permissions-Policy
        value: camera=(), geolocation=(), microphone=(), payment=(), usb=()
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
